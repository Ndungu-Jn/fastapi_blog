[project]
name = "fastapi-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ndungu-Jn", email = "ndungulink@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "aiosqlite>=0.22.1",
    "djlint>=1.46.1",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.6",
    "pillow>=12.3.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
fastapi-blog = "fastapi_blog:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
